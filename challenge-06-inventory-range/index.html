<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Range Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#" class="logo"><span class="logo-dot"></span><span id="storeName">Store</span></a>
      <span class="page-title">Inventory Range Dashboard</span>
      <span class="spacer"></span>
    </div>
  </header>

  <main class="container">

    <!-- ============ CHALLENGE 6 : INVENTORY ============ -->
    <section id="inventory" class="panel">
      <div class="panel-head">
        <div>
          <span class="tag">Challenge 6</span>
          <h2>Inventory Range Dashboard</h2>
          <p class="muted">Pick a price range to see how much stock you have and what it's worth.</p>
        </div>
      </div>

      <form id="invForm" class="row-form" novalidate>
        <label class="field grow">
          <span>Minimum price</span>
          <div class="input-prefix"><b>₹</b><input type="number" id="invMin" min="0" value="5000" /></div>
        </label>
        <label class="field grow">
          <span>Maximum price</span>
          <div class="input-prefix"><b>₹</b><input type="number" id="invMax" min="0" value="20000" /></div>
        </label>
        <button type="submit" class="btn">Search</button>
      </form>

      <div class="dual-range" id="dualRange">
        <div class="dual-track"><div class="dual-fill" id="dualFill"></div></div>
        <input type="range" id="sliderMin" aria-label="Minimum price" />
        <input type="range" id="sliderMax" aria-label="Maximum price" />
      </div>
      <div class="range-labels">
        <span id="sliderMinLabel">₹0</span>
        <span id="sliderMaxLabel">₹0</span>
      </div>

      <p class="form-error" id="invError" role="alert"></p>

      <div class="stats">
        <div class="stat"><span>Products</span><b id="invCount">0</b></div>
        <div class="stat"><span>Units in stock</span><b id="invUnits">0</b></div>
        <div class="stat accent"><span>Inventory value</span><b id="invValue">₹0</b></div>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>Product</th><th class="num">Price</th><th class="num">Stock</th><th class="num">Value</th></tr>
          </thead>
          <tbody id="invTable"></tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="container footer muted small">
    Inventory Range Dashboard &middot; Plain HTML, CSS &amp; JavaScript
  </footer>

  <!-- ============ PRODUCT MODAL ============ -->
  <div class="modal" id="productModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn modal-close" id="closeModal" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/products.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/features/inventory.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
