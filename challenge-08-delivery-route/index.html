<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Delivery Route</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#" class="logo"><span class="logo-dot"></span><span id="storeName">Store</span></a>
      <span class="page-title">Smart Delivery Route</span>
      <span class="spacer"></span>
    </div>
  </header>

  <main class="container">

    <!-- ============ CHALLENGE 8 : DELIVERY ============ -->
    <section id="delivery" class="panel">
      <div class="panel-head">
        <div>
          <span class="tag">Challenge 8</span>
          <h2>Smart Delivery Route</h2>
          <p class="muted">Find the best route from the warehouse to the customer.</p>
        </div>
      </div>

      <form id="routeForm" class="row-form" novalidate>
        <label class="field grow">
          <span>From</span>
          <select id="routeFrom"></select>
        </label>
        <button type="button" class="btn btn-ghost swap-btn" id="swapRoute" title="Swap">⇄</button>
        <label class="field grow">
          <span>To</span>
          <select id="routeTo"></select>
        </label>
        <button type="submit" class="btn">Find route</button>
      </form>

      <div class="mode-toggle" role="radiogroup" aria-label="Route mode">
        <label><input type="radio" name="routeMode" value="distance" checked /> <span>Shortest distance</span></label>
        <label><input type="radio" name="routeMode" value="time" /> <span>Fastest (with traffic)</span></label>
      </div>

      <div class="route-layout">
        <div>
          <div id="routeResult" class="route-result"></div>
        </div>
        <div class="map-card">
          <svg id="routeMap" viewBox="0 0 620 340" role="img" aria-label="Delivery network map"></svg>
          <div class="legend small muted">
            <span><i class="lg lg-low"></i>Free</span>
            <span><i class="lg lg-mid"></i>Moderate</span>
            <span><i class="lg lg-high"></i>Heavy traffic</span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="container footer muted small">
    Smart Delivery Route &middot; Plain HTML, CSS &amp; JavaScript
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/features/delivery.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
