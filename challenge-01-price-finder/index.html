<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Price Finder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#" class="logo"><span class="logo-dot"></span><span id="storeName">Store</span></a>
      <span class="page-title">Smart Price Finder</span>
      <span class="spacer"></span>
    </div>
  </header>

  <main class="container">

    <!-- ============ CHALLENGE 1 : PRICE FINDER ============ -->
    <section id="price-finder" class="panel">
      <div class="panel-head">
        <div>
          <span class="tag">Challenge 1</span>
          <h2>Smart Price Finder</h2>
          <p class="muted">Enter your budget and we'll find the closest matching products.</p>
        </div>
      </div>

      <form id="priceForm" class="row-form" novalidate>
        <label class="field grow">
          <span>Find products around</span>
          <div class="input-prefix">
            <b>₹</b>
            <input type="number" id="targetPrice" placeholder="70000" min="0" inputmode="numeric" />
          </div>
        </label>
        <label class="field">
          <span>Show</span>
          <select id="closestCount">
            <option value="3" selected>3 closest</option>
            <option value="5">5 closest</option>
            <option value="8">8 closest</option>
          </select>
        </label>
        <button type="submit" class="btn">Search</button>
      </form>

      <div class="quick-chips" id="priceChips">
        <span class="muted small">Try:</span>
        <button type="button" data-price="1000">₹1,000</button>
        <button type="button" data-price="10000">₹10,000</button>
        <button type="button" data-price="70000">₹70,000</button>
        <button type="button" data-price="150000">₹1,50,000</button>
      </div>

      <p class="form-error" id="priceError" role="alert"></p>
      <div id="closestResults" class="card-grid"></div>

      <!-- follow-up : range -->
      <div class="sub-block">
        <h3>Find products in a range</h3>
        <form id="rangeForm" class="row-form" novalidate>
          <label class="field grow">
            <span>Minimum price</span>
            <div class="input-prefix"><b>₹</b><input type="number" id="rangeMin" placeholder="50000" min="0" /></div>
          </label>
          <label class="field grow">
            <span>Maximum price</span>
            <div class="input-prefix"><b>₹</b><input type="number" id="rangeMax" placeholder="80000" min="0" /></div>
          </label>
          <button type="submit" class="btn btn-outline">Find products in this range</button>
        </form>
        <p class="form-error" id="rangeError" role="alert"></p>
        <p class="muted small" id="rangeMeta"></p>
        <div id="rangeResults" class="card-grid"></div>
      </div>
    </section>

  </main>

  <footer class="container footer muted small">
    Smart Price Finder &middot; Plain HTML, CSS &amp; JavaScript
  </footer>

  <!-- ============ PRODUCT MODAL ============ -->
  <div class="modal" id="productModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn modal-close" id="closeModal" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/products.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/features/priceFinder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
