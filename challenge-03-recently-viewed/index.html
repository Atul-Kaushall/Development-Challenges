<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recently Viewed Products</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#" class="logo"><span class="logo-dot"></span><span id="storeName">Store</span></a>
      <span class="page-title">Recently Viewed Products</span>
      <span class="spacer"></span>
    </div>
  </header>

  <main class="container">

    <!-- ============ CHALLENGE 3 : RECENTLY VIEWED ============ -->
    <section id="recent" class="panel">
      <div class="panel-head">
        <div>
          <span class="tag">Challenge 3</span>
          <h2>Recently Viewed</h2>
          <p class="muted">The last 5 products you opened, newest first.</p>
        </div>
        <button class="btn btn-ghost" id="clearHistory">Clear history</button>
      </div>
      <div id="recentList" class="h-scroll"></div>
    </section>

    <section id="catalog" class="panel">
      <div class="panel-head">
        <div>
          <h2>All Products</h2>
          <p class="muted">Open any product &mdash; it will show up in Recently Viewed above.</p>
        </div>
      </div>
      <div class="cat-tabs" id="catTabs"></div>
      <div id="catalogGrid" class="card-grid"></div>
    </section>

  </main>

  <footer class="container footer muted small">
    Recently Viewed Products &middot; Plain HTML, CSS &amp; JavaScript
  </footer>

  <!-- ============ PRODUCT MODAL ============ -->
  <div class="modal" id="productModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn modal-close" id="closeModal" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/products.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/features/recentlyViewed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
